[scheduler_configs]
# Comma-separated list of mode names to activate.
# Each mode must have a corresponding [mode_<name>] section below.
modes=weekday,weekend

# Timezone for interpreting scheduled times.
# Uses IANA timezone names (e.g. America/New_York, America/Chicago, UTC).
timezone=America/New_York

[mode_weekday]
# Days: 0=Monday, 1=Tuesday, ..., 4=Friday, 5=Saturday, 6=Sunday
days=0,1,2,3,4
# Times in HHMM 24-hour format (no colon), comma-separated
times=0800,1000,1200,1300,1400,1500,1600,1700,1800,2200

[mode_weekend]
days=5,6
times=1700
